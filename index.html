<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY BABYY!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* The bouquet is the one thing that moves: it opens once on load. */
  .bouquet{
    width:min(290px,70vw);
    height:auto;
    display:block;
    margin:0 auto 10px;
    overflow:visible;
  }
  .bloom{
    transform-box:fill-box;
    transform-origin:center;
    animation:open 2.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .bud-l, .bud-r{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation:sway 2.4s cubic-bezier(.2,.7,.2,1) both;
  }
  .bud-l{--from:6deg;}
  .bud-r{--from:-6deg;}
  @keyframes open{
    from{transform:scale(.35) rotate(-40deg); opacity:0;}
    55%{opacity:1;}
    to{transform:scale(1) rotate(0); opacity:1;}
  }
  @keyframes sway{
    from{transform:rotate(var(--from)); opacity:.0;}
    to{transform:rotate(0); opacity:1;}
  }

  .plates{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 272px));
    justify-content:center;
    gap:28px;
    width:100%;
    max-width:1020px;
    margin:0 auto;
    align-items:stretch;
  }
  .plate{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:28px 22px 24px;
    color:inherit;
    text-decoration:none;
    background:var(--panel);
    border:1px solid var(--gold-dim);
    border-radius:136px 136px 4px 4px;
    transition:border-color .25s ease, background-color .25s ease;
  }
  .plate::before{
    content:"";
    position:absolute; inset:7px;
    border:1px solid var(--gold-dim);
    border-radius:129px 129px 2px 2px;
    opacity:.45;
    pointer-events:none;
    transition:opacity .25s ease, border-color .25s ease;
  }
  .plate:nth-child(2){transform:translateY(-26px);}
  .plate:hover, .plate:focus-visible{border-color:var(--pollen); background:#263a2f;}
  .plate:hover::before, .plate:focus-visible::before{border-color:var(--pollen); opacity:.7;}

  .art{
    width:100%;
    height:140px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    margin-bottom:20px;
  }
  .art svg{height:100%; width:auto; overflow:visible;}
  .art.wide svg{height:auto; width:132px; align-self:center;}

  .plate h2{
    font-family:var(--display);
    font-weight:400;
    font-size:22px;
    line-height:1.12;
    margin:0 0 8px;
    color:var(--petal);
  }
  .plate p{
    margin:0 0 16px;
    font-size:17px;
    color:var(--text-soft);
    max-width:24ch;
  }
  .state{
    margin-top:auto;
    font-style:italic;
    font-size:16px;
    color:var(--gold);
    border-top:1px solid var(--gold-dim);
    padding-top:10px;
    width:100%;
  }

  @media (max-width:980px){
    .plates{grid-template-columns:minmax(0, 320px); gap:30px;}
    .plate:nth-child(2){transform:none;}
  }
  @media (prefers-reduced-motion: reduce){
    .bloom, .bud-l, .bud-r{animation:none;}
    .plate, .plate::before{transition:none;}
  }
</style>
</head>
<body>
<main class="page">

  <svg class="bouquet" viewBox="0 0 400 320" role="img" aria-label="A lily in bloom between two buds">
    <g class="bud-l">
      <use href="#lily-bud" width="96" height="185" transform="translate(200 312) rotate(-34) translate(-48 -183)"/>
    </g>
    <g class="bud-r">
      <use href="#lily-bud" width="96" height="185" transform="translate(200 312) rotate(34) translate(-48 -183)"/>
    </g>
    <path class="l-stem" d="M200 168 C207 214 193 266 200 314"/>
    <path class="l-leaf" d="M200 258 C170 254 150 238 144 214 C168 222 190 238 200 258Z"/>
    <g class="bloom">
      <use href="#lily-open" x="106" y="0" width="188" height="188"/>
    </g>
  </svg>

  <h1> cheanelle's web-things archive!!</h1>
  <p class="sub">Click the website and it will take you there:</p>

  <nav class="plates" aria-label="Projects">

    <a class="plate" href="sol-and-chippy/">
      <div class="art">
        <svg viewBox="0 0 84 162" aria-hidden="true"><use href="#lily-bud" width="84" height="162"/></svg>
      </div>
      <h2>Adventures of Sol and Chippy</h2>
      <p>Download the game here!!</p>
      <span class="state">GOODLUCK :))</span>
    </a>

    <a class="plate" href="soi-message-board/">
      <div class="art wide">
        <svg viewBox="0 0 176 176" aria-hidden="true"><use href="#lily-open" width="176" height="176"/></svg>
      </div>
      <h2>Soi's Message Board</h2>
      <p>My old message board</p>
      <span class="state">Enjoy Reading!</span>
    </a>

    <a class="plate sketch" href="map-of-meanings/">
      <div class="art wide">
        <svg viewBox="0 0 176 176" aria-hidden="true"><use href="#lily-open" width="176" height="176"/></svg>
      </div>
      <h2>Map of You</h2>
      <p>I solemnly swear that...</p>
      <span class="state">I love you <3 </span>
    </a>

  </nav>

  <div class="footer">
    <div class="rule" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 C8 8 8 14 12 20 C16 14 16 8 12 3Z"/><path d="M12 20 C8 17 5 13 4 9 C8 10 11 13 12 20Z"/><path d="M12 20 C16 17 19 13 20 9 C16 10 13 13 12 20Z"/></svg>
    </div>
  </div>

</main>
<script src="shared.js"></script>
</body>
</html>
